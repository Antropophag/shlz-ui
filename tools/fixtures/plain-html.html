<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>SHLZ plain HTML fixture</title>
    <link rel="stylesheet" href="../../packages/styles/dist/shlz.css" />
  </head>
  <body class="shlz-scope">
    <label class="shlz-field" for="fixture-title">
      <span class="shlz-field__label">Название</span>
      <input class="shlz-input" id="fixture-title" />
    </label>
    <label class="shlz-choice">
      <input class="shlz-checkbox" type="checkbox" checked />
      <span>Подтверждение</span>
    </label>
    <fieldset>
      <legend>Вариант</legend>
      <label
        ><input class="shlz-radio" type="radio" name="fixture-choice" checked />
        Первый</label
      >
    </fieldset>
    <label class="shlz-switch">
      <input class="shlz-switch__input" type="checkbox" role="switch" />
      <span>Настройка</span>
    </label>
    <button class="shlz-button shlz-button--primary" type="button">
      Создать
    </button>
    <span class="shlz-status shlz-status--green">Активен</span>
    <div
      class="shlz-dropdown"
      data-shlz-dropdown
      data-component-audit-id="dropdown-plain-html-consumer"
    >
      <button
        class="shlz-button"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="fixture-menu"
      >
        Действия
      </button>
      <div class="shlz-dropdown__menu" id="fixture-menu" role="menu" hidden>
        <button class="shlz-dropdown__item" type="button" role="menuitem">
          Создать
        </button>
        <button
          class="shlz-dropdown__item"
          type="button"
          role="menuitem"
          disabled
        >
          Недоступно
        </button>
      </div>
    </div>
    <button
      class="shlz-button"
      type="button"
      aria-expanded="false"
      aria-controls="fixture-popover"
      data-shlz-popover-trigger="fixture-popover"
      data-shlz-popover-placement="bottom"
    >
      Подробнее
    </button>
    <div
      class="shlz-popover"
      id="fixture-popover"
      data-shlz-popover
      data-component-audit-id="popover-plain-html-consumer"
      hidden
    >
      <span class="shlz-popover__arrow" aria-hidden="true"></span>
      <div class="shlz-popover__header">Заголовок</div>
      <div class="shlz-popover__body">Plain HTML + direct ESM import.</div>
    </div>
    <button
      class="shlz-button"
      type="button"
      data-shlz-tooltip-trigger="fixture-tooltip"
      data-shlz-tooltip-open-delay="0"
    >
      Справка
    </button>
    <div
      class="shlz-tooltip"
      id="fixture-tooltip"
      role="tooltip"
      data-shlz-tooltip
      data-component-audit-id="tooltip-plain-html-consumer"
      hidden
    >
      Подсказка<span class="shlz-tooltip__arrow" aria-hidden="true"></span>
    </div>
    <div class="shlz-tabs" data-shlz-tabs>
      <div class="shlz-tabs__list" role="tablist" aria-label="Пример вкладок">
        <button
          class="shlz-tabs__tab"
          id="fixture-tab-a"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="fixture-panel-a"
        >
          A
        </button>
        <button
          class="shlz-tabs__tab"
          id="fixture-tab-b"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="fixture-panel-b"
        >
          B
        </button>
      </div>
      <div
        class="shlz-tabs__panel"
        id="fixture-panel-a"
        role="tabpanel"
        aria-labelledby="fixture-tab-a"
      >
        Панель A
      </div>
      <div
        class="shlz-tabs__panel"
        id="fixture-panel-b"
        role="tabpanel"
        aria-labelledby="fixture-tab-b"
        hidden
      >
        Панель B
      </div>
    </div>
    <nav class="shlz-pagination" aria-label="Пагинация">
      <ul class="shlz-pagination__list">
        <li>
          <a class="shlz-pagination__item" href="#one" aria-current="page">1</a>
        </li>
        <li><a class="shlz-pagination__item" href="#two">2</a></li>
      </ul>
    </nav>
    <span class="shlz-tag shlz-tag--outlined"
      >Фильтр<button
        class="shlz-tag__remove"
        type="button"
        aria-label="Удалить фильтр"
      >
        ×
      </button></span
    >
    <fieldset class="shlz-segment">
      <legend class="shlz-visually-hidden">Режим</legend>
      <label class="shlz-segment__option"
        ><input
          class="shlz-segment__input"
          type="radio"
          name="mode"
          checked
        /><span class="shlz-segment__label">A</span></label
      ><label class="shlz-segment__option"
        ><input class="shlz-segment__input" type="radio" name="mode" /><span
          class="shlz-segment__label"
          >B</span
        ></label
      >
    </fieldset>
    <div class="shlz-notification" role="status">
      <div class="shlz-notification__content">
        <p class="shlz-notification__title">Сохранено</p>
      </div>
    </div>
    <button
      class="shlz-button"
      type="button"
      data-shlz-modal-trigger="fixture-modal"
    >
      Открыть Modal
    </button>
    <dialog
      class="shlz-modal"
      id="fixture-modal"
      data-shlz-modal
      data-component-audit-id="modal-plain-html"
      aria-labelledby="fixture-modal-title"
    >
      <div class="shlz-modal__surface">
        <header class="shlz-modal__header">
          <h2 class="shlz-modal__title" id="fixture-modal-title">Modal</h2>
          <button
            class="shlz-modal__close"
            type="button"
            data-shlz-modal-close
            aria-label="Закрыть"
          >
            ×
          </button>
        </header>
        <div class="shlz-modal__body">
          Standalone CSS + direct ESM behavior import.
        </div>
      </div>
    </dialog>
    <button
      class="shlz-button"
      type="button"
      data-shlz-drawer-trigger="fixture-drawer"
    >
      Открыть Drawer
    </button>
    <dialog
      class="shlz-drawer"
      id="fixture-drawer"
      data-shlz-drawer
      data-component-audit-id="drawer-plain-html"
      aria-labelledby="fixture-drawer-title"
    >
      <div class="shlz-drawer__surface">
        <header class="shlz-drawer__header">
          <h2 class="shlz-drawer__title" id="fixture-drawer-title">Drawer</h2>
          <button
            class="shlz-drawer__close"
            type="button"
            data-shlz-drawer-close
            aria-label="Закрыть Drawer"
          >
            ×
          </button>
        </header>
        <div class="shlz-drawer__body">Plain HTML consumer.</div>
      </div>
    </dialog>
    <script type="module">
      import {
        enhanceDrawers,
        enhanceDropdowns,
        enhanceModals,
        enhancePopovers,
        enhanceTabs,
        enhanceTooltips,
      } from "../../packages/behaviors/dist/browser.js";
      enhanceDropdowns();
      enhanceModals();
      enhanceDrawers();
      enhancePopovers();
      enhanceTabs();
      enhanceTooltips();
    </script>
  </body>
</html>
