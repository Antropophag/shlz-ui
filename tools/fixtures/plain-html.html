<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>SHLZ plain HTML fixture</title>
    <link rel="stylesheet" href="../../packages/styles/dist/shlz.css" />
  </head>
  <body class="shlz-scope">
    <label class="shlz-field" for="fixture-title">
      <span class="shlz-field__label">Название</span>
      <input class="shlz-input" id="fixture-title" />
    </label>
    <label class="shlz-choice">
      <input class="shlz-checkbox" type="checkbox" checked />
      <span>Подтверждение</span>
    </label>
    <fieldset>
      <legend>Вариант</legend>
      <label
        ><input class="shlz-radio" type="radio" name="fixture-choice" checked />
        Первый</label
      >
    </fieldset>
    <label class="shlz-switch">
      <input class="shlz-switch__input" type="checkbox" role="switch" />
      <span>Настройка</span>
    </label>
    <button class="shlz-button shlz-button--primary" type="button">
      Создать
    </button>
    <span class="shlz-status shlz-status--green">Активен</span>
    <div class="shlz-dropdown" data-shlz-dropdown>
      <button
        class="shlz-button"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="fixture-menu"
      >
        Действия
      </button>
      <div class="shlz-dropdown__menu" id="fixture-menu" role="menu" hidden>
        <button class="shlz-dropdown__item" type="button" role="menuitem">
          Создать
        </button>
        <button
          class="shlz-dropdown__item"
          type="button"
          role="menuitem"
          disabled
        >
          Недоступно
        </button>
      </div>
    </div>
    <script type="module">
      import { enhanceDropdowns } from "../../packages/behaviors/dist/index.js";
      enhanceDropdowns();
    </script>
  </body>
</html>
