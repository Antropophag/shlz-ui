<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHLZ Chart Widget source fixture</title>
    <link rel="stylesheet" href="../../packages/styles/dist/shlz.css" />
    <style>
      body {
        margin: 24px;
        background: #f4f6f9;
      }
    </style>
  </head>
  <body class="shlz-scope">
    <article
      class="shlz-chart-widget shlz-chart-widget--source"
      data-component-audit-id="chart-widget-source-fixture"
      aria-labelledby="source-widget-title"
    >
      <header class="shlz-chart-widget__header">
        <h1 class="shlz-chart-widget__title" id="source-widget-title">
          Рекламации в разрезе статусов и времени
        </h1>
      </header>
      <div class="shlz-chart-widget__controls" aria-label="Параметры отчёта">
        <span>Месяц</span>
      </div>
      <div class="shlz-chart-widget__plot">
        <div class="shlz-chart-widget__empty">
          Chart rendering intentionally remains consumer-owned.
        </div>
      </div>
    </article>
  </body>
</html>
