<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="../../packages/styles/dist/shlz.css" />
    <script type="module">
      import { enhanceFileUploads } from "../../packages/behaviors/dist/index.js";
      enhanceFileUploads();
    </script>
  </head>
  <body class="shlz-scope" style="margin: 20px">
    <div
      class="shlz-file-upload"
      data-shlz-file-upload
      data-component-audit-id="file-upload-plain-html"
      aria-invalid="true"
    >
      <input
        class="shlz-file-upload__input"
        id="fixture-upload"
        type="file"
        multiple
        aria-describedby="fixture-upload-instructions fixture-upload-error"
      />
      <div class="shlz-file-upload__surface">
        <div class="shlz-file-upload__content">
          <p class="shlz-file-upload__title">Drop files here</p>
          <p
            class="shlz-file-upload__instructions"
            id="fixture-upload-instructions"
          >
            Long filenames and localized instructions wrap without clipping
            controls.
          </p>
        </div>
        <label
          class="shlz-button shlz-file-upload__trigger"
          data-component-audit-id="button-file-upload-plain-html"
          for="fixture-upload"
          >Choose files</label
        >
      </div>
      <p class="shlz-file-upload__error" id="fixture-upload-error">
        One or more files need consumer validation.
      </p>
    </div>
  </body>
</html>
