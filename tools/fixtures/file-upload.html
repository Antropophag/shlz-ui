<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>SHLZ File Upload fixture</title>
    <link rel="stylesheet" href="../../packages/styles/dist/shlz.css" />
    <script type="module">
      import { enhanceFileUploads } from "../../packages/behaviors/dist/index.js";
      enhanceFileUploads();
    </script>
  </head>
  <body class="shlz-scope" style="margin: 20px">
    <div
      class="shlz-file-upload"
      data-shlz-file-upload
      data-component-audit-id="file-upload-plain-html"
      aria-invalid="true"
    >
      <input
        class="shlz-file-upload__input"
        id="fixture-upload"
        type="file"
        multiple
        aria-describedby="fixture-upload-error"
      />
      <label class="shlz-file-upload__surface" for="fixture-upload">
        <svg
          class="shlz-icon shlz-file-upload__icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <use
            href="../../packages/icons/dist/sprite.svg#shlz-icon-cloud-upload"
          ></use>
        </svg>
        <span class="shlz-file-upload__instructions"
          >Нажмите или перетащите файл в эту область</span
        >
      </label>
      <p class="shlz-file-upload__error" id="fixture-upload-error">
        One or more files need consumer validation.
      </p>
    </div>
  </body>
</html>
