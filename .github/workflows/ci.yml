name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate assets
        run: npm run generate

      - name: Run tests
        run: npm run test

      - name: Lint JavaScript
        run: npx eslint .

      - name: Lint CSS
        run: npx stylelint 'packages/**/*.css' 'apps/**/*.css'

      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
            | xargs -0 -r npx prettier --check --ignore-unknown

      - name: Build packages and showcase
        run: npm run build

      - name: Validate source fidelity and package exports
        run: node tools/validate.mjs

  browser-tests:
    name: Browser and visual tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and visual tests
        run: npm run test:e2e
