name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate assets
        run: npm run generate

      - name: Build packages required by source tests
        run: npm run build:packages

      - name: Run tests
        run: npm run test

      - name: Lint JavaScript
        run: npx eslint .

      - name: Lint CSS
        run: npx stylelint 'packages/**/*.css' 'apps/**/*.css'

      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
            | sed -zE '/^docs\/exec-plans\/active\/.+\/.+-receipt\.json$/d' \
            | xargs -0 -r npx prettier --check --ignore-unknown --

      - name: Build showcase
        run: npm run build -w @shlz/showcase

      - name: Validate source fidelity and package exports
        run: node tools/validate.mjs

      - name: Verify packed packages from a clean consumer
        run: npm run test:packages

  browser-tests:
    name: Browser and visual tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and visual tests
        run: npm run test:e2e
