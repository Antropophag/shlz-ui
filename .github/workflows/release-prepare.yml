name: Prepare package release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: package-release-preparation
  cancel-in-progress: false

jobs:
  version-pr:
    name: Prepare version pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release policy
        run: npm run release:policy

      - name: Create or update version pull request
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ github.token }}
          version-script: npm run release:version
          commit-message: "chore: version SHLZ packages"
          pr-title: "chore: version SHLZ packages"
          pr-base-branch: main
